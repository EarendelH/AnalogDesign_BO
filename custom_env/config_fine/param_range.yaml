other_variable:
  instance_type: other_variable
  params:
  - variable_name: IBP
    value:
      range: [1.0u,5.0u]
      step: "0.1u"
  - variable_name: R0
    value:
      range: [2.0k,30.0k]
      step: "0.1k"
  - variable_name: R1
    value:
      range: [2.0k,30.0k]
      step: "0.1k"
  - variable_name: CM
    value:
      range: [20.0p,200.0p]
      step: "1.0p"
